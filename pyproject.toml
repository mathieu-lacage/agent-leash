[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-leash"
version = "0.1.0"
authors = [
  {name = "Mathieu Lacage", email = "mathieu.lacage@cutebugs.net"},
]
maintainers = [
  {name = "Mathieu Lacage", email = "mathieu.lacage@cutebugs.net"},
]
description = "Isolated sandbox for AI coding agents"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "mitmproxy>=10.3",
]

[project.urls]
Repository = "https://github.com/mathieu-lacage/agent-leash.git"
Issues = "https://github.com/mathieu-lacage/agent-least/issues"

[project.optional-dependencies]
dev = []

[project.scripts]
aleash = "aleash.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aleash"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
